[project]
name = "keel-harbor-agent"
version = "0.0.0"
description = "Run the keel coding agent as a Terminal-Bench (Harbor) installed agent for the Epic 1.11 parity gate."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
# Exact-pinned (charter supply-chain rule). Harbor is Apache-2.0 (license gate, ADR-0041) and is the
# OQ-4 pin (ADR-0022: harbor@v0.13.2). The pure command builders are stdlib-only; Harbor is needed only
# to import `BaseInstalledAgent` for the agent class (and at Phase-B run time).
dependencies = [
    "harbor==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel_harbor_agent"]
