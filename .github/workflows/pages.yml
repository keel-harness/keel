name: pages

# Publishes the marketing landing page (site/) to GitHub Pages.
# Only site/ is uploaded — the repository itself is never served, so the docs
# tree and source stay reachable through github.com rather than the Pages host.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: read the repo, then mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight publish; a half-deployed Pages site is worse than a
# queued one. Later pushes queue behind the running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Fork PRs must not be able to publish to the project's domain.
    if: github.repository == 'keel-harness/keel'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject external subresources
        # The page must stay self-contained: no CDN scripts, fonts, or trackers.
        # A remote subresource on the landing page of a security project is a
        # third party that can change what visitors execute. Fail closed here.
        #
        # Outbound <a href> links are expected and allowed — this checks only
        # things the browser FETCHES: src=, stylesheet links, @import, url().
        run: |
          fail=0
          check() {
            if grep -nEi "$1" site/index.html; then
              echo "::error::site/index.html: $2"
              fail=1
            fi
          }
          check 'src[[:space:]]*=[[:space:]]*"(https?:)?//' 'external src= (script/img/iframe/video)'
          check '<link[^>]+rel[[:space:]]*=[[:space:]]*"stylesheet"[^>]+href[[:space:]]*=[[:space:]]*"(https?:)?//' 'external stylesheet'
          check '@import[[:space:]]+(url\()?["'"'"']?(https?:)?//' 'external CSS @import'
          check 'url\([[:space:]]*["'"'"']?(https?:)?//' 'external url() in CSS'
          exit $fail

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # The two steps below replace `actions/upload-pages-artifact`. That action is a composite
      # whose final step calls `actions/upload-artifact@v4` — pinned by TAG, not by SHA — which the
      # organization's Actions policy rejects outright ("All actions must also be pinned to a
      # full-length commit SHA"). The wrapper only tars a directory and uploads it under the
      # well-known name `github-pages`, so doing it inline costs nothing and keeps every action in
      # this workflow SHA-pinned. `actions/deploy-pages` is a plain node action with no nested
      # action dependencies, so it needs no equivalent treatment.
      - name: Archive the site as the github-pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `deploy-pages` resolves the deployment payload by this exact artifact name.
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
