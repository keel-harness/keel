name: Public npm release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KEEL_VERSION: "0.1.2"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.16.0"
  PNPM_VERSION: "10.16.0"
  BUN_VERSION: "1.3.14"
  SYFT_VERSION: "1.49.0"

jobs:
  verify:
    if: github.repository == 'keel-harness/keel'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0, MIT
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, MIT
        with:
          python-version: "3.12"
      - name: Install exact workspace graph with scripts disabled
        run: pnpm install --frozen-lockfile
      - name: Install real sandbox prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Full source and security gates
        run: |
          set -euo pipefail
          pnpm run supply-chain:check
          pnpm lint
          pnpm typecheck
          pnpm format
          pnpm build
          pnpm test:cov
          pnpm test:security
      - name: Real OS-sandbox denial probes (fail closed if the backend is unavailable)
        env:
          # Trust only the committed local fixture CA in this test process. Verification remains on;
          # the acceptance suite includes a valid-chain/wrong-host rejection probe.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/vendor/sandbox-runtime/test/fixtures/tls-terminate/ca.crt
        run: pnpm test:sandbox:real

  candidate:
    if: github.repository == 'keel-harness/keel'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0, MIT
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, MIT
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install exact release toolchain and workspace
        run: |
          set -euo pipefail
          test "$(npm --version)" = "$NPM_VERSION"
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install checksum-pinned Syft
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/syft/syft.tar.gz"
          echo "7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe  $RUNNER_TEMP/syft/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft/syft.tar.gz" -C "$RUNNER_TEMP/syft" syft
          "$RUNNER_TEMP/syft/syft" version
          echo "SYFT_BIN=$RUNNER_TEMP/syft/syft" >> "$GITHUB_ENV"
      - name: Assert exact protected public-main release context
        run: node --import tsx packaging/release-cli.ts assert-release-context
      - name: Build npm carrier once
        run: bun packaging/build.ts npx
      - name: Pack release candidate once and prove artifact closure
        run: node --import tsx packaging/release-cli.ts pack-release-candidate
      - name: Installed carrier proof on Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: "20.20.2"
      - name: Smoke exact carrier on Node 20
        run: packaging/smoke-release-carrier.sh "$PWD/build/release/keel-harness-${KEEL_VERSION}.tgz"
      - name: Installed carrier proof on Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: "22.23.2"
      - name: Smoke exact carrier on Node 22
        run: packaging/smoke-release-carrier.sh "$PWD/build/release/keel-harness-${KEEL_VERSION}.tgz"
      - name: Restore candidate Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Smoke exact carrier on Node 24
        run: packaging/smoke-release-carrier.sh "$PWD/build/release/keel-harness-${KEEL_VERSION}.tgz"
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, MIT
        with:
          name: keel-harness-${{ env.KEEL_VERSION }}-${{ github.sha }}
          path: |
            build/release/keel-harness-${{ env.KEEL_VERSION }}.tgz
            build/release/SHA256SUMS
            build/release/keel-harness-${{ env.KEEL_VERSION }}.candidate.json
            build/release/keel-harness-${{ env.KEEL_VERSION }}.spdx.json
            build/release/keel-harness-${{ env.KEEL_VERSION }}.cdx.json
            build/release/keel-harness-${{ env.KEEL_VERSION }}.components.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  attest:
    if: github.repository == 'keel-harness/keel'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, MIT
        with:
          name: keel-harness-${{ env.KEEL_VERSION }}-${{ github.sha }}
          path: build/release
      - name: Verify downloaded carrier digest
        working-directory: build/release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest exact carrier provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1, MIT
        with:
          subject-path: build/release/keel-harness-${{ env.KEEL_VERSION }}.tgz
      - name: Attest SPDX SBOM for exact carrier
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1, MIT
        with:
          subject-path: build/release/keel-harness-${{ env.KEEL_VERSION }}.tgz
          sbom-path: build/release/keel-harness-${{ env.KEEL_VERSION }}.spdx.json
      - name: Attest CycloneDX SBOM for exact carrier
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1, MIT
        with:
          subject-path: build/release/keel-harness-${{ env.KEEL_VERSION }}.tgz
          sbom-path: build/release/keel-harness-${{ env.KEEL_VERSION }}.cdx.json

  draft:
    if: github.repository == 'keel-harness/keel'
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
        with:
          fetch-depth: 0
      - name: Download attested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, MIT
        with:
          name: keel-harness-${{ env.KEEL_VERSION }}-${{ github.sha }}
          path: build/release
      - name: Verify downloaded carrier digest
        working-directory: build/release
        run: sha256sum --check --strict SHA256SUMS
      - name: Create draft GitHub Release for human inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create --draft --verify-tag "$GITHUB_REF_NAME" \
            --title "keel v${KEEL_VERSION}" \
            --notes-file docs/releases/v0.1.2.md \
            "build/release/keel-harness-${KEEL_VERSION}.tgz" \
            build/release/SHA256SUMS \
            "build/release/keel-harness-${KEEL_VERSION}.candidate.json" \
            "build/release/keel-harness-${KEEL_VERSION}.spdx.json" \
            "build/release/keel-harness-${KEEL_VERSION}.cdx.json" \
            "build/release/keel-harness-${KEEL_VERSION}.components.json"

  stage:
    if: github.repository == 'keel-harness/keel'
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download reviewed release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, MIT
        with:
          name: keel-harness-${{ env.KEEL_VERSION }}-${{ github.sha }}
          path: build/release
      - name: Verify exact stage input
        working-directory: build/release
        run: |
          set -euo pipefail
          test "$(npm --version)" = "$NPM_VERSION"
          sha256sum --check --strict SHA256SUMS
          node -e '
            const fs = require("node:fs");
            const candidate = JSON.parse(fs.readFileSync(`keel-harness-${process.env.KEEL_VERSION}.candidate.json`, "utf8"));
            if (candidate.package !== "keel-harness" || candidate.version !== process.env.KEEL_VERSION || candidate.tag !== process.env.GITHUB_REF_NAME || candidate.repository !== process.env.GITHUB_REPOSITORY || candidate.sourceDirty !== false) process.exit(1);
          '
      - name: Stage exact npm carrier for separate 2FA approval
        run: npm stage publish "$PWD/build/release/keel-harness-${KEEL_VERSION}.tgz" --provenance
